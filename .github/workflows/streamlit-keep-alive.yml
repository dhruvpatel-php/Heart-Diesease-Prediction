name: Streamlit Keep-Alive

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Enable manual run from GitHub Actions UI

permissions:
  contents: write
  actions: write

jobs:
  keep-alive:
    name: Wake & Ping Streamlit Cloud Apps
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Headless Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      # Issue 1 Solution: Automatically checks all 5 Streamlit apps and wakes up any sleeping apps
      - name: Run Keep-Alive Script
        run: |
          python scripts/keep_alive.py

      # Issue 2 Solution: Prevents GitHub from disabling scheduled cron jobs after 60 days of inactivity
      - name: Prevent GitHub Workflow Inactivity Auto-Disable
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true
