name: Keep Streamlit Apps Awake

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    # Well within Streamlit Community Cloud inactivity sleep window
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual one-click execution from GitHub Actions tab

permissions:
  contents: write
  actions: write

jobs:
  keep-alive:
    name: Wake Up & Keep Active
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Playwright & Headless Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      # Issue 1 Solution: Automatically wakes up all 5 Streamlit apps and auto-clicks "Yes, get this app back up!"
      - name: Wake Up All Streamlit Apps
        run: python wake_apps.py

      # Issue 2 Solution: Prevents GitHub from disabling scheduled cron jobs after 60 days of inactivity
      - name: Prevent GitHub Workflow Inactivity Auto-Disable
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true
