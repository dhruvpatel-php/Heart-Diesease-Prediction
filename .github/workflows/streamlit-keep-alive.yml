name: Keep Streamlit Apps Awake

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    # Well within Streamlit Community Cloud inactivity sleep window
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual one-click execution from GitHub Actions tab

permissions:
  contents: write

jobs:
  keep-alive:
    name: Wake Up & Keep Active
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Issue 1 Solution: Automatically wakes up sleeping Streamlit apps using Headless Chromium
      - name: Install Playwright & Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Wake Up and Ping Streamlit Applications
        run: |
          python scripts/keep_alive.py

      # Issue 2 Solution: Prevents GitHub from disabling scheduled cron jobs after 60 days of inactivity
      # Keeps repo active via native GitHub Actions bot commit without broken third-party actions
      - name: Prevent GitHub Workflow Inactivity Auto-Disable
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .github
          echo "Last keep-alive heartbeat: $(date -u)" > .github/keepalive.txt
          git add .github/keepalive.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: keep actions alive [skip ci]" && git push)
