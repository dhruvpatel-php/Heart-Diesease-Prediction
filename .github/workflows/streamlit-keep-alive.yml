name: Streamlit Keep-Alive

on:
  schedule:
    # Run every 12 hours (00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Enable manual run from GitHub Actions UI

jobs:
  keep-alive:
    name: Wake & Ping Streamlit Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Keep-Alive Script
        env:
          STREAMLIT_APP_URL: "https://heart-diesease-prediction-by-dhruvv.streamlit.app/"
        run: |
          python scripts/keep_alive.py
